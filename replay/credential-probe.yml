name: Credential probe
# Runs the same Claude Code call on an API key and on a subscription token, with no Wachiman in
# between, and records every turn. Started by hand from the Actions tab (workflow_dispatch).
# Source: wachiman-benchmarks `replay/credential-probe.yml`; put on this repository's `main`
# through the contents API. The release bisect found that the same Wachiman batch makes about 15
# turns on a key and about 9 on a token; this probe checks whether Claude Code alone does that.
on:
  workflow_dispatch:
    inputs:
      head_ref: { description: "Branch with the change to review", type: string, default: "replay-v1150k/pr-465/head" }
      base_ref: { description: "Branch to diff against", type: string, default: "replay-v1150k/pr-465/base" }
      runs: { description: "Run numbers per credential, comma-separated", type: string, default: "1,2,3" }
      credentials: { description: "JSON list: api-key, oauth-token", type: string, default: '["api-key","oauth-token"]' }
      model: { type: string, default: "claude-opus-5-5" }
      effort: { type: string, default: "high" }
      max_turns: { type: number, default: 40 }
      budget_usd: { description: "--max-budget-usd per call. Wachiman batches use 0.75", type: number, default: 3 }
      claude_code_version: { type: string, default: "2.1.304" }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        credential: ${{ fromJSON(inputs.credentials) }}
        run: ${{ fromJSON(format('[{0}]', inputs.runs)) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.head_ref }}", fetch-depth: 0 }
      - name: Write the diff
        env: { BASE: "${{ inputs.base_ref }}" }
        run: |
          git fetch -q origin "$BASE"
          mkdir -p "$RUNNER_TEMP/probe"
          git diff "origin/$BASE...HEAD" > probe.diff
          git diff --stat "origin/$BASE...HEAD" | tail -1
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Claude Code
        env: { VERSION: "${{ inputs.claude_code_version }}" }
        run: npm i -g --silent "@anthropic-ai/claude-code@$VERSION" && claude --version
      - name: Run the call
        env:
          CREDENTIAL: ${{ matrix.credential }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
          MAX_TURNS: ${{ inputs.max_turns }}
          BUDGET: ${{ inputs.budget_usd }}
        run: |
          out="$RUNNER_TEMP/probe/out.jsonl"
          # One credential only, in a clean environment and a fresh profile, so that nothing else
          # differs between the two kinds of run.
          if [ "$CREDENTIAL" = api-key ]; then cred="ANTHROPIC_API_KEY=$KEY"; else cred="CLAUDE_CODE_OAUTH_TOKEN=$TOKEN"; fi
          home="$RUNNER_TEMP/home"; mkdir -p "$home"
          prompt='Review the pull request whose diff is in the file probe.diff in the current directory. Read the changed files, and the code they call, to check the change. Then list each real bug you find: file and line, what goes wrong, and why. Do not modify any file.'
          env -i PATH="$PATH" HOME="$home" CLAUDE_CONFIG_DIR="$home/.claude" "$cred" \
            DISABLE_TELEMETRY=1 DISABLE_ERROR_REPORTING=1 DISABLE_AUTOUPDATER=1 CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 \
            claude -p --model "$MODEL" --effort "$EFFORT" --max-turns "$MAX_TURNS" --max-budget-usd "$BUDGET" \
              --restricted --strict-mcp-config --tools Read,Grep,Glob --allowedTools Read,Grep,Glob \
              --disallowedTools Bash --no-session-persistence --output-format stream-json --verbose \
              "$prompt" > "$out" || echo "claude exited with $?"
      - name: Check the output carries no secret
        env: { KEY: "${{ secrets.ANTHROPIC_API_KEY }}", TOKEN: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" }
        run: |
          out="$RUNNER_TEMP/probe/out.jsonl"
          for s in "$KEY" "$TOKEN"; do [ -n "$s" ] && grep -qF "$s" "$out" && { echo "secret found in output"; rm -f "$out"; exit 1; }; done; true
      - name: Summarize
        env: { CREDENTIAL: "${{ matrix.credential }}", RUN: "${{ matrix.run }}" }
        run: |
          out="$RUNNER_TEMP/probe/out.jsonl"
          jq -s --arg cred "$CREDENTIAL" --arg run "$RUN" '
            (map(select(.type=="system" and .subtype=="init"))[0] // {}) as $init
            | (map(select(.type=="result"))[0] // {}) as $r
            | [ .[] | select(.type=="assistant") | .message ] as $m
            | ($r.usage.cache_creation.ephemeral_5m_input_tokens // 0) as $c5
            | ($r.usage.cache_creation.ephemeral_1h_input_tokens // 0) as $c1
            | {
                credential: $cred, run: ($run|tonumber),
                api_key_source: $init.apiKeySource, model: $init.model, claude_code_version: $init.claude_code_version,
                subtype: $r.subtype, stop_reason: $r.stop_reason, num_turns: $r.num_turns, duration_ms: $r.duration_ms,
                cost_usd: $r.total_cost_usd, output_tokens: $r.usage.output_tokens,
                thinking_tokens: ($r.usage.output_tokens_details.thinking_tokens // null),
                cache_read_tokens: $r.usage.cache_read_input_tokens, cache_write_tokens: $r.usage.cache_creation_input_tokens,
                cache_write_5m_tokens: $c5, cache_write_1h_tokens: $c1,
                cache_ttl: (if $c1 > 0 and $c5 > 0 then "5m+1h" elif $c1 > 0 then "1h" elif $c5 > 0 then "5m" elif ($r.usage.cache_creation_input_tokens // 0) > 0 then "?" else "none" end),
                assistant_messages: ($m|length),
                tool_calls: ([ $m[].content[]? | select(.type=="tool_use") ] | length),
                tools_used: ([ $m[].content[]? | select(.type=="tool_use") | .name ] | group_by(.) | map({(.[0]): length}) | add),
                thinking_blocks: ([ $m[].content[]? | select(.type=="thinking" or .type=="redacted_thinking") ] | length),
                thinking_chars: ([ $m[].content[]? | select(.type=="thinking") | .thinking | length ] | add // 0),
                redacted_thinking_blocks: ([ $m[].content[]? | select(.type=="redacted_thinking") ] | length),
                final_chars: (($r.result // "") | length)
              }' "$out" > "$RUNNER_TEMP/probe/summary.json"
          cat "$RUNNER_TEMP/probe/summary.json"
      - uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.credential }}-${{ matrix.run }}
          path: ${{ runner.temp }}/probe/
  report:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "probe-*", path: probes }
      - name: Report
        env:
          HEAD_REF: ${{ inputs.head_ref }}
          BASE_REF: ${{ inputs.base_ref }}
          RUNS: ${{ inputs.runs }}
          CREDENTIALS: ${{ inputs.credentials }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
          MAX_TURNS: ${{ inputs.max_turns }}
          BUDGET: ${{ inputs.budget_usd }}
          VERSION: ${{ inputs.claude_code_version }}
        run: |
          # One file with every call, for download, then a report that leads with the comparison.
          jq -s 'sort_by(.credential, .run)' probes/*/summary.json > probe-summary.json 2>/dev/null || echo '[]' > probe-summary.json
          expected=$(( $(jq 'length' <<<"$CREDENTIALS") * $(tr ',' '\n' <<<"$RUNS" | grep -c .) ))
          jq -r --argjson expected "$expected" --argjson cap "$BUDGET" --argjson max_turns "$MAX_TURNS" \
            --arg head "$HEAD_REF" --arg base "$BASE_REF" --arg model "$MODEL" --arg effort "$EFFORT" --arg version "$VERSION" '
            def r1: (. * 10 | round) / 10;
            def mean(f): (map(f // 0) | add / length);
            def name: if . == "api-key" then "API key" elif . == "oauth-token" then "Subscription token" else . end;
            def fixed(d): (pow(10; d)) as $p | (. * $p | round) as $n
              | ($n / $p | floor | tostring) + "." + (($n % $p) | tostring | ("000" + .)[-d:]);
            def money: if . == null then "?" else "$" + fixed(2) end;
            def money3: if . == null then "?" else "$" + fixed(3) end;
            def ended: (.subtype // "no result") + (if .stop_reason then " (\(.stop_reason))" else "" end);
            . as $all
            # Calls with no result event are listed under "Check these calls", never averaged.
            | ($all | map(select(.num_turns != null)) | group_by(.credential) | map({
                credential: .[0].credential,
                calls: length,
                turns: map(.num_turns), tmean: mean(.num_turns),
                ended: (map(ended) | group_by(.) | map("\(length) \(.[0])") | join(", ")),
                tools: mean(.tool_calls), out: mean(.output_tokens), think: mean(.thinking_tokens),
                secs: mean((.duration_ms // 0) / 1000), cost: mean(.cost_usd),
                cpt: ((map(.cost_usd // 0) | add) / ((map(.num_turns // 0) | add) | if . == 0 then 1 else . end)),
                ttl: (map(.cache_ttl // "?") | unique | join(", "))
              })) as $g
            | ($g | map({(.credential): .}) | add // {}) as $by
            | "## Credential probe: \($head) against \($base)",
              "",
              "Claude Code \($version), `\($model)`, effort `\($effort)`, cap \($cap | money) and \($max_turns) turns per call. \($all | length) of \($expected) calls reported.",
              "",
              ( if ($by["api-key"] and $by["oauth-token"]) then
                  ($by["api-key"]) as $k | ($by["oauth-token"]) as $t
                  | (($k.turns | min) > ($t.turns | max) or ($t.turns | min) > ($k.turns | max)) as $apart
                  | "**Turns per call: \($k.tmean | r1) on the API key (\($k.turns | map(tostring) | join(" / "))), \($t.tmean | r1) on the subscription token (\($t.turns | map(tostring) | join(" / "))). "
                    + (if $apart then "The ranges do not overlap.**" else "The ranges overlap, so this run does not separate the two.**" end),
                  "",
                  "Cost per turn: \($k.cpt | money3) on the key, \($t.cpt | money3) on the token (an estimate). Prompt-cache lifetime: \($k.ttl) on the key, \($t.ttl) on the token."
                elif ($all | length) == 0 then "**No call reported a summary.**" else "Only one credential reported, so there is no comparison." end ),
              "",
              "| Credential | Calls with a result | Turns (mean) | How calls ended | Tool calls | Output tokens | Thinking tokens | Seconds | Cost per call | Cost per turn | Cache lifetime |",
              "| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |",
              ( $g[] | "| \(.credential | name) | \(.calls) | \(.tmean | r1) | \(.ended) | \(.tools | r1) | \(.out | round) | \(.think | round) | \(.secs | round) | \(.cost | money)\(if .credential == "oauth-token" then " (estimate)" else "" end) | \(.cpt | money3) | \(.ttl) |" ),
              "",
              "A turn is one model response: it thinks, calls a tool, reads the result. Cache lifetime is how long Claude Code asks the API to keep the prompt cache; a 1-hour write is priced higher than a 5-minute one.",
              "",
              ( [ $all[]
                  | if .subtype != "success" then "- \(.credential) run \(.run) ended as `\(.subtype // "no result")`."
                    elif (.num_turns // 0) >= $max_turns then "- \(.credential) run \(.run) reached the turn limit."
                    elif (.cost_usd // 0) >= ($cap * 0.95) then "- \(.credential) run \(.run) reached its cap (\(.cost_usd | money))."
                    else empty end ]
                | if length > 0 then ("**Check these calls:**", .[], "") elif ($all | length) > 0 then ("Every call ended on its own, below its turn limit and its cap.", "") else empty end ),
              ( if ($all | length) < $expected then "**\($expected - ($all | length)) call(s) left no summary:** see their jobs.", "" else empty end ),
              "<details><summary>Every call</summary>",
              "",
              "| Credential | Run | Key source | Ended | Turns | Tool calls | Output tokens | Thinking tokens | Seconds | Cost | Cache |",
              "| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |",
              ( $all[] | "| \(.credential) | \(.run) | \(.api_key_source // "?") | \(ended) | \(.num_turns) | \(.tool_calls) | \(.output_tokens) | \(.thinking_tokens) | \((.duration_ms // 0) / 1000 | round) | \(.cost_usd | money) | \(.cache_ttl) |" ),
              "",
              "</details>",
              "",
              "Download `probe-summary` for every field of every call."
          ' probe-summary.json >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: probe-summary, path: probe-summary.json }
