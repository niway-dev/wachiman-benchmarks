name: Credential probe
# Runs the same Claude Code call on an API key and on a subscription token, with no Wachiman in
# between, and records every turn. Started by hand from the Actions tab (workflow_dispatch).
# Source: wachiman-benchmarks `replay/credential-probe.yml`; put on this repository's `main`
# through the contents API. The release bisect found that the same Wachiman batch makes about 15
# turns on a key and about 9 on a token; this probe checks whether Claude Code alone does that.
on:
  workflow_dispatch:
    inputs:
      head_ref: { description: "Branch with the change to review", type: string, default: "replay-v1150k/pr-465/head" }
      base_ref: { description: "Branch to diff against", type: string, default: "replay-v1150k/pr-465/base" }
      runs: { description: "Run numbers per credential, comma-separated", type: string, default: "1,2,3" }
      credentials: { description: "JSON list: api-key, oauth-token", type: string, default: '["api-key","oauth-token"]' }
      model: { type: string, default: "claude-opus-5-5" }
      effort: { type: string, default: "high" }
      max_turns: { type: number, default: 40 }
      budget_usd: { description: "--max-budget-usd per call. Wachiman batches use 0.75", type: number, default: 3 }
      claude_code_version: { type: string, default: "2.1.304" }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        credential: ${{ fromJSON(inputs.credentials) }}
        run: ${{ fromJSON(format('[{0}]', inputs.runs)) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.head_ref }}", fetch-depth: 0 }
      - name: Write the diff
        env: { BASE: "${{ inputs.base_ref }}" }
        run: |
          git fetch -q origin "$BASE"
          mkdir -p "$RUNNER_TEMP/probe"
          git diff "origin/$BASE...HEAD" > probe.diff
          git diff --stat "origin/$BASE...HEAD" | tail -1
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Claude Code
        env: { VERSION: "${{ inputs.claude_code_version }}" }
        run: npm i -g --silent "@anthropic-ai/claude-code@$VERSION" && claude --version
      - name: Run the call
        env:
          CREDENTIAL: ${{ matrix.credential }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
          MAX_TURNS: ${{ inputs.max_turns }}
          BUDGET: ${{ inputs.budget_usd }}
        run: |
          out="$RUNNER_TEMP/probe/out.jsonl"
          # One credential only, in a clean environment and a fresh profile, so that nothing else
          # differs between the two kinds of run.
          if [ "$CREDENTIAL" = api-key ]; then cred="ANTHROPIC_API_KEY=$KEY"; else cred="CLAUDE_CODE_OAUTH_TOKEN=$TOKEN"; fi
          home="$RUNNER_TEMP/home"; mkdir -p "$home"
          prompt='Review the pull request whose diff is in the file probe.diff in the current directory. Read the changed files, and the code they call, to check the change. Then list each real bug you find: file and line, what goes wrong, and why. Do not modify any file.'
          env -i PATH="$PATH" HOME="$home" CLAUDE_CONFIG_DIR="$home/.claude" "$cred" \
            DISABLE_TELEMETRY=1 DISABLE_ERROR_REPORTING=1 DISABLE_AUTOUPDATER=1 CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 \
            claude -p --model "$MODEL" --effort "$EFFORT" --max-turns "$MAX_TURNS" --max-budget-usd "$BUDGET" \
              --restricted --strict-mcp-config --tools Read,Grep,Glob --allowedTools Read,Grep,Glob \
              --disallowedTools Bash --no-session-persistence --output-format stream-json --verbose \
              "$prompt" > "$out" || echo "claude exited with $?"
      - name: Check the output carries no secret
        env: { KEY: "${{ secrets.ANTHROPIC_API_KEY }}", TOKEN: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" }
        run: |
          out="$RUNNER_TEMP/probe/out.jsonl"
          for s in "$KEY" "$TOKEN"; do [ -n "$s" ] && grep -qF "$s" "$out" && { echo "secret found in output"; rm -f "$out"; exit 1; }; done; true
      - name: Summarize
        env: { CREDENTIAL: "${{ matrix.credential }}", RUN: "${{ matrix.run }}" }
        run: |
          out="$RUNNER_TEMP/probe/out.jsonl"
          jq -s --arg cred "$CREDENTIAL" --arg run "$RUN" '
            (map(select(.type=="system" and .subtype=="init"))[0] // {}) as $init
            | (map(select(.type=="result"))[0] // {}) as $r
            | [ .[] | select(.type=="assistant") | .message ] as $m
            | {
                credential: $cred, run: ($run|tonumber),
                api_key_source: $init.apiKeySource, model: $init.model, claude_code_version: $init.claude_code_version,
                subtype: $r.subtype, num_turns: $r.num_turns, duration_ms: $r.duration_ms,
                cost_usd: $r.total_cost_usd, output_tokens: $r.usage.output_tokens,
                cache_read_tokens: $r.usage.cache_read_input_tokens, cache_write_tokens: $r.usage.cache_creation_input_tokens,
                assistant_messages: ($m|length),
                tool_calls: ([ $m[].content[]? | select(.type=="tool_use") ] | length),
                tools_used: ([ $m[].content[]? | select(.type=="tool_use") | .name ] | group_by(.) | map({(.[0]): length}) | add),
                thinking_blocks: ([ $m[].content[]? | select(.type=="thinking" or .type=="redacted_thinking") ] | length),
                thinking_chars: ([ $m[].content[]? | select(.type=="thinking") | .thinking | length ] | add // 0),
                redacted_thinking_blocks: ([ $m[].content[]? | select(.type=="redacted_thinking") ] | length),
                final_chars: (($r.result // "") | length)
              }' "$out" > "$RUNNER_TEMP/probe/summary.json"
          cat "$RUNNER_TEMP/probe/summary.json"
      - uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.credential }}-${{ matrix.run }}
          path: ${{ runner.temp }}/probe/
  report:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "probe-*", path: probes }
      - name: Table
        run: |
          {
            echo "| Credential | Run | Key source | Ended | Turns | Tool calls | Thinking blocks | Thinking chars | Output tokens | Seconds | Cost |"
            echo "| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |"
            jq -s -r 'sort_by(.credential, .run)[] | "| \(.credential) | \(.run) | \(.api_key_source) | \(.subtype) | \(.num_turns) | \(.tool_calls) | \(.thinking_blocks) | \(.thinking_chars) | \(.output_tokens) | \((.duration_ms // 0)/1000|floor) | \(.cost_usd) |"' probes/*/summary.json
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
