name: Wachi bench review
# Benchmark copy. Replayed pull requests carry kaipu-record's own `agent-review.yml` (Wachi
# v1.2.0, the version that produced the 2026-10-31 field benchmark); that workflow is disabled in
# this repository's Actions settings so that only this one runs. Reviews are started on demand
# with `/wachi review`, because a `pull_request` event would use the workflow at the replayed
# commit, not this one. Pin bumps here mark which engine version reviewed which run.
on:
  issue_comment: { types: [created] }
permissions: { contents: read, pull-requests: write, issues: read }
jobs:
  review:
    # Prompt-cache check (W34-W36): v1.21.0 plus the fix that forces a 5-minute prompt cache
    # (wachiman branch fix/token-prompt-cache-5m), by SHA, on kaipu-record #465 and #467, with the
    # same inputs as W13-W15 (v1.21.0, $10, token). Subscription token only: no API key is passed,
    # so the cost is an API-equivalent estimate.
    uses: niway-dev/wachiman/.github/workflows/review.yml@8a9a6d782aa1f6c9ef88f1430e8f5cd789f2c8ce # v1.21.0 + 5m cache
    with:
      operator: csdev19
      model: claude-opus-5-5
      effort: high
      verify: false
      budget_usd: 10
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
