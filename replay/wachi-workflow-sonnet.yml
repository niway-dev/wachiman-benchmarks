name: Wachi bench review
# Benchmark copy. Replayed pull requests carry kaipu-record's own `agent-review.yml` (Wachi
# v1.2.0, the version that produced the 2026-10-31 field benchmark); that workflow is disabled in
# this repository's Actions settings so that only this one runs. Reviews are started on demand
# with `/wachi review`, because a `pull_request` event would use the workflow at the replayed
# commit, not this one. Pin bumps here mark which engine version reviewed which run.
on:
  issue_comment: { types: [created] }
permissions: { contents: read, pull-requests: write, issues: read }
jobs:
  review:
    uses: niway-dev/wachiman/.github/workflows/review.yml@621aa3943538e5785d3734a46934749942f2cf1a # v1.21.0
    with:
      operator: csdev19
      # Sonnet 5.5 is the engine's default model; this file measures it as the release baseline.
      model: claude-sonnet-5-5
      effort: high
      verify: false
      # Every run of the current engine gives a review $10, not the $3 default. In v1.20.1 and v1.21.0,
      # batches run four at once and each reserves its $0.75 cap, so on a large pull request
      # (kaipu-record #467: 47 files, 6 batches, about $3 to read in full) the last batches found
      # no room left and the review ended partial (W7-W12). A partial review is not comparable
      # with a full one. The review still costs what it reads; the extra budget is only room.
      # See replay/README.md, "Review budget".
      budget_usd: 10
    secrets:
      # Subscription token only, from `claude setup-token`. The API key is not passed, so no run can
      # fall back to it; cost is reported as an API-equivalent estimate (ADR 0037).
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
